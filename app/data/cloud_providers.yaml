# The owners of the IP addresses of THORNodes, as the node infographic (nodes.jinja2) names them.
#
# A provider is found by the number of the autonomous system (asn) first, then by a word or a phrase (match)
# in the names GeoIP gives: the AS name, the organization and the ISP. The words are matched whole and
# in any case, so "ovh" finds "OVH SAS" but not "Novohost". An owner that is not here gets the name of its
# AS without "LLC", "GmbH" and the like (models/cloud_provider.py).
#
# To add a provider look its AS up, e.g. http://ip-api.com/json/1.2.3.4?fields=as,org,isp

providers:
