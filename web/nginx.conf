user nginx;
worker_processes    2;

events {
    worker_connections    1024;
}

http {
    include /etc/nginx/mime.types;
    client_max_body_size 5m;

    # Docker's embedded DNS. Containers get new IPs when they are recreated, so every proxy_pass below uses
    # a variable: nginx then resolves the name per request instead of once at startup (stale IP -> 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # plain HTTP only serves Let's Encrypt challenges (certbot service); everything else goes to HTTPS
    server {
        listen 80;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # the certificate covers only settings.thornode.org
            return 301 https://settings.thornode.org$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name settings.thornode.org nodeop.thornode.org bot-dash.thornode.org;

        ssl_certificate /etc/letsencrypt/live/settings.thornode.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/settings.thornode.org/privkey.pem;

        charset utf-8;

        root /web/frontend;
        index index.html;

        # frontend
        location / {
            try_files $uri $uri/ /index.html?uri=$uri;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # backend urls
        location ~ ^/(api|slack)/ {
            proxy_redirect off;
            set $api_upstream http://api:8077;
            proxy_pass $api_upstream;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
        }

        location = /dashboard {
            return 301 /dashboard/;
        }

        location /dashboard/ {
            auth_basic "Dashboard";
            auth_basic_user_file /etc/nginx/htpasswd-dash-logs;

            # Vue SPA + FastAPI (app/dashboard_api.py). proxy_pass with a variable does not strip the
            # location prefix, so the rewrite does it; set must come first, as break skips it otherwise
            set $dashboard_upstream http://dashboard:8501;
            rewrite ^/dashboard/(.*)$ /$1 break;
            proxy_pass $dashboard_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # the basic-auth user, recorded in the dashboard's activity log (always overwritten here)
            proxy_set_header X-Remote-User $remote_user;
            proxy_http_version 1.1;
            proxy_redirect off;
            # /api/events is a Server-Sent Events stream: the app sends "X-Accel-Buffering: no" and a
            # heartbeat every 15 s, so the default buffering and 60 s read timeout are fine
        }

        location ^~ /logs/ {
            auth_basic "Restricted Logs";
            auth_basic_user_file /etc/nginx/htpasswd-dash-logs;

            set $dozzle_upstream http://dozzle:8080;
            proxy_pass $dozzle_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }
    }
}
